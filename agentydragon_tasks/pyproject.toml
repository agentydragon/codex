[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentydragon_tasks"
version = "0.1.0"
description = "AgentDragon task management tools"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click",
    "toml",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
tasks = "agentydragon_tasks.task:cli"
